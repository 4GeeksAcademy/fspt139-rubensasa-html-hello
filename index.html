<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
</head>
<body>
    <h1>My Instagram Profile</h1>
    <div class="profile">
        <img src="profile.jpg" alt="Profile Picture" class="profile-pic">
        <h2>John Doe</h2>
        <p>@johndoe</p>
        <p>Photographer | Traveler | Foodie</p>
        <div class="stats">
            <div><strong>150</strong> Posts</div>
            <div><strong>10K</strong> Followers</div>
            <div><strong>500</strong> Following</div>
        </div>
        <div class="bio">
            <p>Capturing moments from around the world. Follow my journey!</p>
        </div>
        <div class="actions">
            <button class="follow-btn"><i class="fas fa-user-plus"></i> Follow</button>
            <button class="message-btn"><i class="fas fa-envelope"></i> Message</button>
        </div> 
    </div>

</body>
</html>
